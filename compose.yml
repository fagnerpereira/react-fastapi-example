services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - /app/.venv
      # - sqlite_data:/app/storage
    ports:
      - "8000:8000"
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    restart: unless-stopped

